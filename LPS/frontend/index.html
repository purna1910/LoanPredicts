<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Prediction Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Loan Eligibility Prediction System</h1>
        
        <!-- Loan Application Form -->
        <div class="form-section">
            <h2>Apply for Loan</h2>
            <form id="loanForm">
                <label>Gender:</label>
                <select name="Gender" required>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>

                <label>Married:</label>
                <select name="Married" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>

                <label>Dependents:</label>
                <select name="Dependents" required>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3+</option>
                </select>

                <label>Education:</label>
                <select name="Education" required>
                    <option value="1">Graduate</option>
                    <option value="0">Not Graduate</option>
                </select>

                <label>Self Employed:</label>
                <select name="Self_Employed" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>

                <label>Applicant Income:</label>
                <input type="number" name="ApplicantIncome" required>

                <label>Coapplicant Income:</label>
                <input type="number" name="CoapplicantIncome" required>

                <label>Loan Amount:</label>
                <input type="number" name="LoanAmount" required>

                <label>Loan Amount Term (months):</label>
                <input type="number" name="Loan_Amount_Term" value="360" required>

                <label>Credit History:</label>
                <select name="Credit_History" required>
                    <option value="1">Good (1)</option>
                    <option value="0">Bad (0)</option>
                </select>

                <label>Property Area:</label>
                <select name="Property_Area" required>
                    <option value="0">Rural</option>
                    <option value="1">Semiurban</option>
                    <option value="2">Urban</option>
                </select>

                <button type="submit">Predict Loan Status</button>
            </form>

            <div id="result" class="result"></div>
        </div>

        <!-- Chatbot Section -->
        <div class="chatbot-section">
            <h2>AI Assistant</h2>
            <div id="chatbox" class="chatbox"></div>
            <input type="text" id="chatInput" placeholder="Ask about documents, eligibility...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
